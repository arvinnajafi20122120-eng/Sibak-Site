# Render Blueprint — سرویس چت سیبک (WebSocket)
# این فایل را در ریشه‌ی repo قرار دهید و در Render: New → Blueprint → Import بزنید.
# Render به‌صورت خودکار سرویس چت را روی پلن رایگان با پورت دلخواه بالا می‌آورد.

services:
  - type: web
    name: sibak-chat
    runtime: node
    plan: free
    rootDir: mini-services/chat-service
    buildCommand: bun install
    startCommand: bun run index.ts
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
